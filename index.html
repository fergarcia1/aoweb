<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AOWEB — Paso 1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background: #0d1117;
        overflow: hidden;
        color: #e6edf3;
        font-family: "Segoe UI", Tahoma, sans-serif;
      }
      #game {
        width: 100%;
        height: 100%;
      }
      #game canvas {
        image-rendering: pixelated;
        image-rendering: crisp-edges;
        display: block;
      }
      #app-navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 16px;
        background: rgba(13, 17, 23, 0.94);
        border-bottom: 1px solid #4a4a4a;
        backdrop-filter: blur(6px);
        pointer-events: none;
      }
      #app-navbar .brand {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #c9a227;
        margin-right: 4px;
      }
      #app-navbar .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
      }
      #app-navbar button {
        pointer-events: auto;
        padding: 7px 14px;
        border: 1px solid #5c5c5c;
        border-radius: 6px;
        background: #212121;
        color: #e6edf3;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #app-navbar button:hover {
        background: #2a3446;
        border-color: #c9a227;
      }
      #app-navbar button.nav-primary {
        border-color: #8a7330;
        background: #2a2418;
        color: #f0e6c8;
        font-weight: 600;
      }
      #app-navbar button.nav-primary:hover {
        background: #3d3420;
        border-color: #c9a227;
      }
      #app-navbar .nav-status {
        margin-left: auto;
        font-size: 12px;
        color: #9aa4b2;
        pointer-events: none;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <nav id="app-navbar" aria-label="Navegación principal">
      <span class="brand">AOWEB</span>
      <div class="nav-actions">
        <button type="button" id="nav-news-btn">Noticias</button>
        <button type="button" id="nav-wiki-btn">Wiki</button>
        <button type="button" id="nav-play-btn" class="nav-primary">Jugar</button>
      </div>
      <span id="nav-status" class="nav-status" aria-live="polite"></span>
    </nav>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
