<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" href='data:image/svg+xml,%3Csvg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"%3E%3Crect width="64" height="64" fill="%23120706"/%3E%3Cpath d="M12 48 L32 8 L52 48 L42 48 L32 24 L22 48 Z" fill="%23c9a227"/%3E%3C/svg%3E' />
    <title>AOWEB — Paso 1</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        width: 100%;
        height: 100%;
        background:
          linear-gradient(90deg, rgba(8, 10, 16, 0.7), rgba(16, 7, 6, 0.72)),
          url("/assets/ui/aoweb-dragon-war-loading.png") center center / cover no-repeat fixed,
          #0d1117;
        overflow: hidden;
        color: #e6edf3;
        font-family: Verdana, Arial, Helvetica, sans-serif;
      }
      :root {
        --app-nav-height: 44px;
      }
      #game {
        position: fixed;
        top: var(--app-nav-height);
        left: 0;
        right: 0;
        bottom: 0;
      }
      #game canvas {
        /* auto: el texto HUD/nombres se lee bien; los sprites usan filtro NEAREST en Phaser */
        image-rendering: auto;
        display: block;
      }
      #app-navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        z-index: 100;
        display: flex;
        align-items: center;
        gap: 12px;
        height: 44px;
        padding: 0 16px;
        background: rgba(10, 8, 9, 0.9);
        border-bottom: 1px solid #7d3028;
        backdrop-filter: blur(6px);
        pointer-events: none;
      }
      #app-navbar .brand {
        font-size: 15px;
        font-weight: 700;
        letter-spacing: 0.06em;
        color: #c9a227;
        margin-right: 4px;
      }
      #app-navbar .nav-actions {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-shrink: 0;
      }
      #app-navbar button {
        pointer-events: auto;
        padding: 7px 14px;
        border: 1px solid #5c5c5c;
        border-radius: 6px;
        background: #212121;
        color: #e6edf3;
        font: inherit;
        font-size: 13px;
        cursor: pointer;
      }
      #app-navbar button:hover {
        background: #2a3446;
        border-color: #c9a227;
      }
      #app-navbar button.nav-primary {
        border-color: #8a7330;
        background: #2a2418;
        color: #f0e6c8;
        font-weight: 600;
      }
      #app-navbar button.nav-primary:hover {
        background: #3d3420;
        border-color: #c9a227;
      }
      #app-navbar .nav-status {
        margin-left: auto;
        font-size: 12px;
        color: #9aa4b2;
        pointer-events: none;
        min-height: 1em;
      }
    </style>
  </head>
  <body>
    <nav id="app-navbar" aria-label="Navegación principal">
      <span class="brand">AOWEB</span>
      <div class="nav-actions">
        <button type="button" id="nav-news-btn">Noticias</button>
        <button type="button" id="nav-wiki-btn">Wiki</button>
        <button type="button" id="nav-play-btn" class="nav-primary">Jugar</button>
      </div>
      <span id="nav-status" class="nav-status" aria-live="polite"></span>
    </nav>
    <div id="game"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
